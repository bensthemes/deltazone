<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lancer bounce</title>
    <link rel="shortcut icon" href="lancer.png" type="image/x-icon">
    <style>
        * {
            word-wrap: break-word;
        }

        @font-face {
            font-family: 'Determination Mono';
            src: url('../page/DeterminationMonoWebRegular-Z5oq.ttf') format('truetype');
            font-weight: lighter;
            font-style: normal;
        }

        .ice-trancer {
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(0deg,rgb(44, 34, 50) 0%, rgb(132, 123, 171) 27%, rgb(198, 239, 255) 52%, rgb(102, 183, 254) 78%, rgb(53, 73, 132) 100%);
            text-shadow: 1px 1px 3px #b0e1ff3d;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-family: 'Determination Mono', monospace;
            font-size: 1.2rem;
        }

        .title, .buttons-wrapper, .music-toggle {
            position: fixed;
            text-align: center;
        }

        .title {
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
        }

        .buttons-wrapper {
            bottom: 0;
            left: 0;
            width: 100%;
            padding-bottom: 1rem;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .buttons {
            width: fit-content;
        }

        button {
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            background-color: rgb(173, 220, 255);
            border-radius: 5px;
            font-family: inherit;
            font-size: 1.3rem;
        }

        button:hover {
            background-color: rgb(130, 169, 198);
        }

        .music-toggle {
            top: 0;
            right: 0;
            padding: 1rem 1rem 0 0;
        }

        .music-toggle button {
            border: 2px solid rgb(173, 220, 255);
            background-color: black;
        }

        .music-toggle button:hover {
            background-color: rgb(47, 64, 76);
        }

        canvas {
            background-color: black;
        }
    </style>
</head>
<body>
    <div class="title">
        <h1 class="ice-trancer" style="margin-bottom: 0;">LOOK AT HIM GO</h1>
        <p>there is no point to this it's literally just lancer.</p>
    </div>
    <div class="music-toggle">
        <audio id="bg-music" preload="auto" loop>
            <source src="https://file.garden/acoeqRVugnRof4eN/Thrash%20Machine.mp3">
        </audio>
        <button id="mute-button">
            🔇
        </button>
    </div>
    
    <canvas>

    </canvas>
    <div class="buttons-wrapper">
        <p>Current number of lancers: <span id="lancer-amount"></span></p>
        <div class="buttons">
            <button id="add" style="margin-right: 0.7rem;">Add lancer</button>
            <button id="reset">Reset lancers</button>
        </div>
            
    </div>
    
    
</body>
<script src="lancer.js"></script>
<script>
        const bgMusic = document.getElementById("bg-music");
        const btn = document.getElementById("mute-button");
        bgMusic.volume = 0.4;

        console.log(btn);
        console.log(bgMusic)

        btn.addEventListener("click", () => {

            console.log(bgMusic.paused);

            if(bgMusic.paused) {
                bgMusic.play();
                btn.textContent = "🔊";
            } else {
                bgMusic.pause();
                btn.textContent = "🔇";
            }
        });
</script>
</html>
