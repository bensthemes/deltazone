<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deltarchive</title>

    <link rel="stylesheet" href="deltastyle.css">
    <link rel="shortcut icon" href="thedeltarune.png" type="image/x-icon">
    <style>

        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: monospace;
            font-size: 16pt;
            background-color: rgba(36, 36, 36);
            background-image: none;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            line-height: 1.9em;
            background-blend-mode: darken;
            color: white;
            border: none;
        }

        .wrapper {
            width: 100%;
            display: block;
        }

        header, .description {
            width: 100%;
            display: block;
            margin: 0;
            padding: 0.5rem 1.5rem;
        }

        nav {
            width: 100%;
            display: block;
            margin: auto;
            position: sticky;
            top: 0;
            background-color: rgba(36, 36, 36);
            z-index: 3;
            text-align: center;
            padding: 1rem 1.5rem;
        }

        nav li {
            display: inline;
            margin-right: 1rem;
        }

        main {
            color: white;
            flex-direction: column;
            max-height: none;
            padding: 1rem;
            padding-left: 3rem;
            border-left: solid white 2px;
            margin-bottom: 3rem;
            position: relative;
            font-size: 15pt;
        }

        main p {
            margin: 0;
        }

        .comment {
            color: rgba(255, 255, 255, 0.832);
            margin: 0;
        }

        .comment::before {
            content: '> ';
        }

        h1 {
            font-size: 24pt;
            margin-top: 10px
        }

        h2 {
            margin-bottom: 0;
            font-size: 18pt;
        }

        p {
            margin: 7px;
        }

        aside p {
            margin: 0;
        }

        .description {
            line-height: 1.4em;
            margin: 0.9rem auto;
        }

        .entry {
            display: flex;
            margin-bottom: 1.7rem;
        }

        .entry-side {
            padding-top: 1rem;
        }

        .entry-main {
            line-height: 1.4;
            margin-left: 1.5rem;
        }

        .post::before {
            content: '✒️';
        }

        .video::before {
            content: '🎥';
        }

        hr {
            width: 100%;
            border: white 1px solid;
            margin: 1rem auto;
        }

        b {
            color: white;
        }

        .warn {
            color: rgba(255, 0, 0, 0.741);
        }

        @media only screen and (max-width: 600px) {
            .container {
                overflow: auto;
            }

            .wrapper {
                flex-direction: column;
            }

            aside, .container {
                width: inherit;
            }

            .container {
                border: none;
                height: auto;
            }

            nav {
                position: sticky;
                top: 0;
            }

            main {
                height: inherit;
                border: none;
                margin-bottom: 0;
            }

            .description, main, header {
                padding: 1rem 0.4rem;
            }

            body {
                font-size: 1.3rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            main {
                font-size: 1.2rem;
            }
        }

    </style>
    
</head>
<body>       
    <div class="container">

        <div class="wrapper">
            <header>
                <a href="index.html">< back</a>
                <center>
                    <img src="https://web.archive.org/web/20060616032910/http://geocities.com:80/angelbmine2/startwnkleclr.gif" alt="" title="the light only you can see">
                    <!--<h1>MY DELTARUNE ARCHIVE</h2>-->

                    <div>
                        <p>This page is currently undergoing renovations. Please come back later.</p>
                    </div>
                    <br><br><br>
                    <img src="https://blob.gifcities.org/gifcities/7SUEH6FSYMZQ567SCZJS5BTSPTA7UCGU.gif" alt="">
                </center>
            
            </header>

            
        </div>
        
    </div>
    
    
</body>
</html>
